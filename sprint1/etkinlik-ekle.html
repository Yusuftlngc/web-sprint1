<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
</head>

<body>

    <header>
        <h1>Etkinlik Ekle</h1>

        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlik-liste.html">Liste</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Yeni Etkinlik</h2>

            <form>

                <p>
                    <label for="etkinlikAdi">Etkinlik Adı</label>
                    <br>
                    <input
                        type="text"
                        id="etkinlikAdi"
                        name="etkinlikAdi"
                        required>
                </p>

                <p>
                    <label for="kategori">Kategori</label>
                    <br>

                    <select
                        id="kategori"
                        name="kategori"
                        required>

                        <option value="">Kategori seçin</option>
                        <option value="seminer">Seminer</option>
                        <option value="atolye">Atölye</option>
                        <option value="konferans">Konferans</option>

                    </select>
                </p>

                <p>
                    <label for="tarih">Tarih</label>
                    <br>

                    <input
                        type="date"
                        id="tarih"
                        name="tarih"
                        required>
                </p>

                <p>
                    <label for="aciklama">Açıklama</label>
                    <br>

                    <textarea
                        id="aciklama"
                        name="aciklama"
                        rows="4"
                        cols="30"
                        required></textarea>
                </p>

                <button type="submit">Kaydet</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Ad Soyad - 2026</p>
    </footer>

</body>

</html>
