<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Etkinlik Güncelle</title>

    <link rel="stylesheet" href="css/2321032005.css">
    <script type="module" src="js/event-form.js"></script>
</head>

<body>

    <header>
        <h1>Etkinlik Güncelle</h1>

        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>

        <form id="etkinlik-formu" data-mode="guncelle" novalidate>

            <div class="form-alani">
                <label for="ad">Etkinlik adı</label>

                <input
                    type="text"
                    id="ad"
                    name="ad">

                <span id="ad-hata"></span>
            </div>

            <div class="form-alani">
                <label for="kategori">Kategori</label>

                <select
                    id="kategori"
                    name="kategori">

                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>

                </select>

                <span id="kategori-hata"></span>
            </div>

            <div class="form-alani">
                <label for="tarih">Tarih</label>

                <input
                    type="date"
                    id="tarih"
                    name="tarih">

                <span id="tarih-hata"></span>
            </div>

            <div class="form-alani">
                <label for="saat">Saat</label>

                <input
                    type="time"
                    id="saat"
                    name="saat">

                <span id="saat-hata"></span>
            </div>

            <div class="form-alani">
                <label for="yer">Yer</label>

                <input
                    type="text"
                    id="yer"
                    name="yer">

                <span id="yer-hata"></span>
            </div>

            <div class="form-alani">
                <label for="kontenjan">Kontenjan</label>

                <input
                    type="number"
                    id="kontenjan"
                    name="kontenjan">

                <span id="kontenjan-hata"></span>
            </div>

            <div class="form-alani">
                <label for="aciklama">Açıklama</label>

                <textarea
                    id="aciklama"
                    name="aciklama"
                    rows="4"></textarea>
            </div>

            <button type="submit">Güncelle</button>

            <div id="form-mesaj"></div>

        </form>

    </main>

    <footer>
        <p>Yusuf Tolunç - 2026</p>
    </footer>

</body>

</html>
